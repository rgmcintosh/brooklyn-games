<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Coloring Fun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:sans-serif;background:linear-gradient(#fff9c4,#ffe0f0);display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.btn{font-size:40px;background:#fff;border:none;border-radius:24px;padding:6px 16px;box-shadow:0 4px 10px #0002;text-decoration:none;color:#333;cursor:pointer}
.btn:active{transform:scale(.9)}
#title{font-size:30px;font-weight:bold}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:6px}
svg#pic{width:100%;height:100%;max-height:100%;touch-action:none}
svg#pic [data-r]{stroke:#222;stroke-width:6;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
#pal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px;max-height:40vh;overflow-y:auto;touch-action:pan-y}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 8px #0003;cursor:pointer;transition:transform .1s}
.sw.sel{transform:scale(1.25);border-color:#333}
@media (orientation:landscape){#main{flex-direction:row-reverse}#pal{max-height:none;width:300px;align-content:center;overflow-y:auto}}
@media (orientation:portrait){#main{flex-direction:column}}
.spark{position:absolute;font-size:40px;pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-150%) scale(1.5);opacity:0}}
</style></head><body>
<div id="top"><a class="btn" href="index.html">🏠</a><button class="btn" id="prev">⬅️</button><span id="title"></span><button class="btn" id="next">➡️</button><button class="btn" id="reset">🧽</button></div>
<div id="main"><div id="stage"><svg id="pic" viewBox="0 0 400 400"></svg></div><div id="pal"></div></div>
<script>
var COLORS=["#d50000","#ff5252","#ff8a80","#ff6d00","#ffab40","#ffd600","#fff176","#64dd17","#b2ff59","#1b5e20","#00bfa5","#84ffff","#2962ff","#82b1ff","#0d47a1","#6200ea","#b388ff","#c51162","#ff80ab","#f8bbd0","#795548","#9e9e9e","#000000","#ffffff"];
var P=[
{n:"🐱 Kitty",s:'<circle data-r cx="200" cy="230" r="120"/><polygon data-r points="100,160 110,50 180,115"/><polygon data-r points="300,160 290,50 220,115"/><circle data-r cx="155" cy="210" r="22"/><circle data-r cx="245" cy="210" r="22"/><polygon data-r points="185,255 215,255 200,275"/><ellipse data-r cx="200" cy="310" rx="40" ry="18"/>'},
{n:"🐟 Fish",s:'<ellipse data-r cx="180" cy="200" rx="130" ry="85"/><polygon data-r points="300,200 380,120 380,280"/><polygon data-r points="150,120 200,60 230,125"/><circle data-r cx="110" cy="180" r="20"/><path data-r d="M170 140 Q200 200 170 260 Q140 200 170 140Z"/>'},
{n:"🏠 House",s:'<rect data-r x="80" y="180" width="240" height="190"/><polygon data-r points="60,185 200,50 340,185"/><rect data-r x="170" y="270" width="60" height="100"/><rect data-r x="100" y="210" width="50" height="50"/><rect data-r x="250" y="210" width="50" height="50"/><rect data-r x="260" y="70" width="35" height="70"/>'},
{n:"🚗 Car",s:'<rect data-r x="40" y="190" width="320" height="100" rx="25"/><path data-r d="M100 190 L140 110 L270 110 L310 190Z"/><polygon data-r points="150,125 195,125 195,185 120,185"/><polygon data-r points="210,125 260,125 290,185 210,185"/><circle data-r cx="115" cy="295" r="40"/><circle data-r cx="285" cy="295" r="40"/>'},
{n:"🌸 Flower",s:'<rect data-r x="190" y="230" width="20" height="160"/><ellipse data-r cx="140" cy="320" rx="50" ry="20"/><circle data-r cx="200" cy="80" r="50"/><circle data-r cx="280" cy="140" r="50"/><circle data-r cx="250" cy="225" r="50"/><circle data-r cx="150" cy="225" r="50"/><circle data-r cx="120" cy="140" r="50"/><circle data-r cx="200" cy="155" r="42"/>'},
{n:"☀️ Sun",s:'<polygon data-r points="200,10 225,90 175,90"/><polygon data-r points="200,390 225,310 175,310"/><polygon data-r points="10,200 90,175 90,225"/><polygon data-r points="390,200 310,175 310,225"/><polygon data-r points="65,65 130,110 110,130"/><polygon data-r points="335,65 290,130 270,110"/><polygon data-r points="65,335 110,270 130,290"/><polygon data-r points="335,335 270,290 290,270"/><circle data-r cx="200" cy="200" r="100"/><circle data-r cx="165" cy="180" r="14"/><circle data-r cx="235" cy="180" r="14"/><path data-r d="M150 225 Q200 275 250 225Z"/>'}
];
var cur=0,col=COLORS[0],pic=document.getElementById('pic'),pal=document.getElementById('pal');
COLORS.forEach(function(c,i){var d=document.createElement('div');d.className='sw'+(i?'':' sel');d.style.background=c;d.addEventListener('pointerdown',function(e){e.preventDefault();col=c;document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});d.classList.add('sel')});pal.appendChild(d)});
function show(){pic.innerHTML=P[cur].s;pic.querySelectorAll('[data-r]').forEach(function(r){r.setAttribute('fill','#fff')});document.getElementById('title').textContent=P[cur].n}
pic.addEventListener('pointerdown',function(e){var t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-r'))return;e.preventDefault();t.setAttribute('fill',col);var st=document.getElementById('stage').getBoundingClientRect(),s=document.createElement('div');s.className='spark';s.textContent=['✨','⭐','🌟','💖'][Math.random()*4|0];s.style.left=(e.clientX-st.left)+'px';s.style.top=(e.clientY-st.top)+'px';document.getElementById('stage').appendChild(s);setTimeout(function(){s.remove()},800)});
document.getElementById('prev').onclick=function(){cur=(cur+P.length-1)%P.length;show()};
document.getElementById('next').onclick=function(){cur=(cur+1)%P.length;show()};
document.getElementById('reset').onclick=show;
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('touchmove',function(e){if(!e.target.closest('#pal'))e.preventDefault()},{passive:false});
show();
</script></body></html>
