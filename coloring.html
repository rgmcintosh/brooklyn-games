<script src="home.js"></script><style>#top{margin-right:76px;padding-right:6px!important;gap:6px}#title{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}@media (max-width:520px){#top .btn{font-size:30px;padding:4px 10px}#title{font-size:20px}}</style>
<style>#top{padding-right:78px!important}</style><meta charset="utf-8"><title>Coloring Fun</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:sans-serif;background:linear-gradient(#fff9c4,#ffe0f0);display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.btn{font-size:40px;background:#fff;border:none;border-radius:24px;padding:6px 16px;box-shadow:0 4px 10px #0002;text-decoration:none;color:#333;cursor:pointer}
.btn:active{transform:scale(.9)}
#title{font-size:30px;font-weight:bold}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:6px}
svg#pic{width:100%;height:100%;max-height:100%;touch-action:none}
svg#pic [data-r]{stroke:#222;stroke-width:6;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
#pal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px;max-height:40vh;overflow-y:auto;touch-action:pan-y}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 8px #0003;cursor:pointer;transition:transform .1s}
.sw.sel{transform:scale(1.25);border-color:#333}
@media (orientation:landscape){#main{flex-direction:row-reverse}#pal{max-height:none;width:300px;align-content:center;overflow-y:auto}}
@media (orientation:portrait){#main{flex-direction:column}}
.spark{position:absolute;font-size:40px;pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-150%) scale(1.5);opacity:0}}
</style></head><body>

COLORS.forEach(function(c,i){var d=document.createElement('div');d.className='sw'+(i?'':' sel');d.style.background=c;d.addEventListener('pointerdown',function(e){e.preventDefault();col=c;document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel')});d.classList.add('sel')});pal.appendChild(d)});

pic.addEventListener('pointerdown',function(e){var t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-r'))return;e.preventDefault();t.setAttribute('fill',col);var st=document.getElementById('stage').getBoundingClientRect(),s=document.createElement('div');s.className='spark';s.textContent=['✨','⭐','🌟','💖'][Math.random()*4|0];s.style.left=(e.clientX-st.left)+'px';s.style.top=(e.clientY-st.top)+'px';document.getElementById('stage').appendChild(s);setTimeout(function(){s.remove()},800)});
