<script src="nozoom.js"></script><script>window.HOME_POS='left';window.HOME_HREF='music.html'</script><script src="home.js"></script><meta charset="utf-8"><title>Guitar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}

<h1>🎸 Guitar 🎶</h1>
<div id="g"><div id="body"><div id="hole"></div></div><div id="neck"></div><div id="head"></div></div>
<div id="ch"></div>
<script>
var COL=['#ff4d4d','#ff9a3c','#ffd23d','#4cd964','#3fa9ff','#b35cff'];
// strings top->bottom = high e .. low E (as seen when held). MIDI per chord
var CH={'🎵':[64,59,55,50,45,40],'C':[64,60,55,52,48,40],'G':[67,59,55,50,47,43],'D':[66,62,57,50,45,38]};
var CC={'🎵':'#ff6fb5','C':'#4cd964','G':'#3fa9ff','D':'#ff9a3c'};
var cur='🎵',g=document.getElementById('g'),neck=document.getElementById('neck'),S=[];
for(var f=1;f<6;f++){var i=document.createElement('i');i.style.left=(f*16)+'%';neck.appendChild(i)}
COL.forEach(function(c,k){var d=document.createElement('div');d.className='s';d.style.top=(30+k*40/6-5.5+40/12)+'%';var l=document.createElement('div');l.style.height=(5+k*1.6)+'px';l.style.background='linear-gradient('+c+','+c+'aa)';d.appendChild(l);g.appendChild(d);S.push(d)});
var chb=document.getElementById('ch');Object.keys(CH).forEach(function(n){var b=document.createElement('button');b.textContent=n;b.style.background=CC[n];if(n===cur)b.className='sel';
 b.addEventListener('pointerdown',function(e){e.preventDefault();cur=n;[].forEach.call(chb.children,function(x){x.className=x===b?'sel':''});strum()});chb.appendChild(b)});
var ac,master;
function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.4;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}if(ac.state!=='running')ac.resume();return ac}
function unlock(){var a=audio();if(a){var s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}}
['touchstart','pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true,capture:true})});
// Karplus-Strong pluck
function ks(sr,f,dur){var n=Math.floor(sr*dur),out=new Float32Array(n),P=Math.max(2,Math.round(sr/f)),buf=new Float32Array(P);
 for(var i=0;i<P;i++)buf[i]=(Math.random()*2-1)*.8;var idx=0,prev=0;
 for(i=0;i<n;i++){var v=buf[idx],nx=buf[(idx+1)%P];var y=.996*.5*(v+nx);buf[idx]=y;out[i]=v;idx=(idx+1)%P}
 // soften attack
 for(i=0;i<Math.min(n,64);i++)out[i]*=i/64;return out}
var cache={};
function pluck(k){var a=audio();if(!a)return;var m=CH[cur][k],key=m+'|'+a.sampleRate;if(!cache[key]){var d=ks(a.sampleRate,440*Math.pow(2,(m-69)/12),2.5),b=a.createBuffer(1,d.length,a.sampleRate);b.getChannelData(0).set(d);cache[key]=b}
 var s=a.createBufferSource(),gn=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;s.buffer=cache[key];gn.gain.value=.55;s.connect(lp);lp.connect(gn);gn.connect(master);s.start();
 var el=S[k];el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
function strum(){for(var k=5;k>=0;k--)(function(k){setTimeout(function(){pluck(k)},(5-k)*35)})(k)}
function strAt(y){var best=-1,bd=1e9;S.forEach(function(s,k){var r=s.getBoundingClientRect(),c=r.top+r.height/2,d=Math.abs(y-c);if(d<bd){bd=d;best=k}});var r0=S[0].getBoundingClientRect();return bd<=r0.height*.75?best:-1}
var P={};
g.addEventListener('pointerdown',function(e){e.preventDefault();try{g.setPointerCapture(e.pointerId)}catch(_){}var k=strAt(e.clientY);P[e.pointerId]={y:e.clientY,k:k};if(k>=0)pluck(k);else strum()});
g.addEventListener('pointermove',function(e){var p=P[e.pointerId];if(!p)return;var y0=Math.min(p.y,e.clientY),y1=Math.max(p.y,e.clientY);
 S.forEach(function(s,k){if(k===p.k)return;var r=s.getBoundingClientRect(),c=r.top+r.height/2;if(c>y0&&c<=y1){pluck(k);p.k=k}});p.y=e.clientY});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){g.addEventListener(n,function(e){delete P[e.pointerId]})});
g.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});g.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ac)ac.resume()});
window._test={ks:ks,strAt:strAt,CH:CH};
</script></body></html>
