<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js"></script><script>window.HOME_POS='left';window.HOME_HREF='music.html'</script><script src="home.js"></script><meta charset="utf-8"><title>Xylophone</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
h1{margin:4px 0 8px;font-size:clamp(20px,min(5vh,7vw),44px);color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
#inst{position:relative;flex:1;min-height:0;touch-action:none}

#inst{display:flex;align-items:center;justify-content:center;gap:1.6vmin;padding:2vmin 1vmin;background:linear-gradient(transparent 22%,#a0623a 22% 27%,transparent 27% 73%,#a0623a 73% 78%,transparent 78%)}
.x{flex:1;border-radius:2.5vmin;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2vmin 0;color:#fff;font-weight:900;font-size:clamp(26px,8vmin,72px);-webkit-text-stroke:2px #0005;text-shadow:0 3px 0 #0004;box-shadow:0 8px 0 #0003,inset 0 0 0 .8vmin #fff6;transition:filter .2s}
.x i{width:2.6vmin;height:2.6vmin;border-radius:50%;background:#fff;box-shadow:inset 0 2px 3px #0005}
.on{animation:ring .4s}@keyframes ring{0%{transform:translateY(6px) scale(.97);filter:brightness(1.45)}30%{transform:translateY(-3px) rotate(1.5deg)}60%{transform:rotate(-1deg)}100%{transform:none}}
</style></head><body>
<h1>🌈 Xylophone 🎶</h1>
<div id="inst"></div>
<script>
var ac,master;
function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.35;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}if(ac.state!=='running')ac.resume();return ac}
function unlock(){var a=audio();if(a){var s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}}
['touchstart','pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true,capture:true})});
var box=document.getElementById('inst');
box.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});box.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
addEventListener('contextmenu',function(e){e.preventDefault()});
function flash(el){el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
function hitAt(x,y,sel){var e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(sel):null}

var C=['#ff4d4d','#ff9a3c','#ffd23d','#4cd964','#3fc6f0','#5b7bff','#b35cff','#ff6fb5'],N='CDEFGABC',M=[72,74,76,77,79,81,83,84];
C.forEach(function(c,k){var d=document.createElement('div');d.className='x';d.style.background=c;d.style.height=(92-k*5)+'%';d.dataset.m=M[k];d.innerHTML='<i></i>'+N[k]+'<i></i>';box.appendChild(d)});
// struck bar: inharmonic partials (1, 3.93, 9.0) with fast decay on upper
function strike(m){var a=audio();if(!a)return;var f=440*Math.pow(2,(m-69)/12),t=a.currentTime;
 [[1,.5,1.6],[3.93,.12,.35],[9.0,.04,.12]].forEach(function(p){var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*p[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p[1],t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);o.connect(g);g.connect(master);o.start(t);o.stop(t+p[2]+.05)})}
var last={};
function go(id,x,y){var el=hitAt(x,y,'.x');if(!el||last[id]===el)return;last[id]=el;strike(+el.dataset.m);flash(el)}
box.addEventListener('pointerdown',function(e){e.preventDefault();try{box.setPointerCapture(e.pointerId)}catch(_){}last[e.pointerId]=null;go(e.pointerId,e.clientX,e.clientY)});
box.addEventListener('pointermove',function(e){if(e.pointerId in last)go(e.pointerId,e.clientX,e.clientY)});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){box.addEventListener(n,function(e){delete last[e.pointerId]})});
window._t={strike:strike};
</script></body></html>
