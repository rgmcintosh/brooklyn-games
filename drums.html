<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js"></script><script>window.HOME_POS='left';window.HOME_HREF='index.html#music-classroom'</script><script src="home.js"></script><meta charset="utf-8"><title>Drums</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
h1{margin:4px 0 8px;font-size:clamp(20px,min(5vh,7vw),44px);color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
#inst{position:relative;flex:1;min-height:0;touch-action:none}

#inst{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3vmin;padding:1vmin}
@media (orientation:portrait){#inst{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}
.p{border-radius:50%;margin:auto;height:100%;width:auto;aspect-ratio:1;max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:clamp(18px,4vmin,36px);text-shadow:0 2px 0 #0005;box-shadow:0 10px 0 #0003,inset 0 0 0 1.6vmin #fff7,inset 0 -2vmin 3vmin #0002;transition:filter .2s}
.p .em{font-size:clamp(34px,9vmin,90px)}
.p.cy{border-radius:50%;background:radial-gradient(circle,#fff6b0,#ffd23d 30%,#e8a800 70%,#c88a00)!important;color:#7a4a00;text-shadow:0 2px 0 #fff8}
.on{animation:hit .3s}@keyframes hit{0%{transform:scale(.88);filter:brightness(1.4)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.cy.on{animation:shim .5s}@keyframes shim{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(.93);filter:brightness(1.3)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
</style></head><body>
<h1>🥁 Drums 🎉</h1>
<div id="inst">
<div class="p" data-k="kick" style="background:#ff4d6d"><div class="em">💥</div>Boom</div>
<div class="p" data-k="snare" style="background:#3fa9ff"><div class="em">⭐</div>Tap</div>
<div class="p cy" data-k="crash"><div class="em">✨</div>Crash</div>
<div class="p" data-k="tomh" style="background:#4cd964"><div class="em">🐸</div>Bop</div>
<div class="p" data-k="toml" style="background:#b35cff"><div class="em">🐻</div>Bum</div>
<div class="p cy" data-k="hat"><div class="em">🔔</div>Tss</div>
</div>
<script>
var ac,master;
function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.35;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}if(ac.state!=='running')ac.resume();return ac}
function unlock(){var a=audio();if(a){var s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}}
['touchstart','pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true,capture:true})});
var box=document.getElementById('inst');
box.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});box.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
addEventListener('contextmenu',function(e){e.preventDefault()});
function flash(el){el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
function hitAt(x,y,sel){var e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(sel):null}

var noiseBuf;function noise(a){if(!noiseBuf){var n=a.sampleRate,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b}var s=a.createBufferSource();s.buffer=noiseBuf;return s}
function env(a,g,peak,dec){var t=a.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}
function tone(a,f0,f1,dec,peak){var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dec*.6);env(a,g,peak,dec);o.connect(g);g.connect(master);o.start(t);o.stop(t+dec+.05)}
function hiss(a,type,freq,dec,peak){var s=noise(a),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;f.type=type;f.frequency.value=freq;env(a,g,peak,dec);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dec+.05)}
var SND={kick:function(a){tone(a,150,48,.45,.9)},snare:function(a){tone(a,220,160,.12,.35);hiss(a,'highpass',1500,.18,.35)},
 tomh:function(a){tone(a,300,190,.3,.6)},toml:function(a){tone(a,170,105,.4,.7)},
 crash:function(a){hiss(a,'highpass',5000,1.2,.22);hiss(a,'bandpass',8000,.8,.12)},hat:function(a){hiss(a,'highpass',8000,.09,.25)}};
function hit(el){var a=audio();if(!a||!el)return;SND[el.dataset.k](a);flash(el)}
box.addEventListener('pointerdown',function(e){e.preventDefault();hit(hitAt(e.clientX,e.clientY,'.p'))});
window._t={SND:SND};
</script></body></html>
