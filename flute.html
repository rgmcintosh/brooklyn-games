<style>

<h1>🎶 Flute 🐦</h1>
<div id="inst"><div id="notes"></div><div id="fl"></div></div>
<script>
var ac,master;
function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.35;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}if(ac.state!=='running')ac.resume();return ac}

['touchstart','pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true,capture:true})});
var box=document.getElementById('inst');
box.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});box.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});

var C=['#ff4d4d','#ff9a3c','#ffd23d','#4cd964','#3fc6f0','#5b7bff','#b35cff','#ff6fb5'],N='CDEFGABC',M=[72,74,76,77,79,81,83,84];
var fl=document.getElementById('fl'),notes=document.getElementById('notes');
C.forEach(function(c,k){var d=document.createElement('div');d.className='h';d.style.background=c;d.dataset.m=M[k];d.textContent=N[k];fl.appendChild(d)});
function blow(m){var a=audio();if(!a)return null;var f=440*Math.pow(2,(m-69)/12),t=a.currentTime,g=a.createGain(),o=a.createOscillator(),o2=a.createOscillator(),g2=a.createGain(),v=a.createOscillator(),vg=a.createGain(),lp=a.createBiquadFilter();
 o.type='sine';o.frequency.value=f;o2.type='triangle';o2.frequency.value=f*2;g2.gain.value=.12;v.frequency.value=5;vg.gain.value=f*.006;v.connect(vg);vg.connect(o.frequency);vg.connect(o2.frequency);
 lp.type='lowpass';lp.frequency.value=f*4;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.09);g.gain.setTargetAtTime(.28,t+.09,.3);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(master);
 // breathy noise at onset
 var nb=a.createBuffer(1,a.sampleRate*.25,a.sampleRate),d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var ns=a.createBufferSource(),nf=a.createBiquadFilter(),ng=a.createGain();ns.buffer=nb;nf.type='bandpass';nf.frequency.value=f*2;ng.gain.value=.05;ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start(t);
 [o,o2,v].forEach(function(x){x.start(t)});return {g:g,os:[o,o2,v]}}
function stop(s){if(!s||!ac)return;var t=ac.currentTime;s.g.gain.cancelScheduledValues(t);s.g.gain.setValueAtTime(Math.max(s.g.gain.value,.0001),t);s.g.gain.exponentialRampToValueAtTime(.0001,t+.25);s.os.forEach(function(o){o.stop(t+.3)})}
var act={};
function press(id,el){var c=act[id];if(c&&c.el===el)return;release(id);if(!el)return;el.classList.add('on');act[id]={el:el,s:blow(+el.dataset.m)};
 var n=document.createElement('span');n.textContent=['♪','♫','🎵'][Math.floor(Math.random()*3)];n.style.left=(el.getBoundingClientRect().left+10)+'px';n.style.color=el.style.background;notes.appendChild(n);setTimeout(function(){n.remove()},1500)}
function release(id){var c=act[id];if(!c)return;delete act[id];stop(c.s);if(!Object.keys(act).some(function(k){return act[k].el===c.el}))c.el.classList.remove('on')}

box.addEventListener('pointerdown',function(e){e.preventDefault();try{box.setPointerCapture(e.pointerId)}catch(_){}press(e.pointerId,hitAt(e.clientX,e.clientY,'.h'))});
box.addEventListener('pointermove',function(e){if(act[e.pointerId])press(e.pointerId,hitAt(e.clientX,e.clientY,'.h'))});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){box.addEventListener(n,function(e){release(e.pointerId)})});
