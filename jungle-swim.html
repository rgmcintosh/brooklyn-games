<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html,body{touch-action:manipulation}</style>
<script src="nozoom.js"></script>
<script src="home.js"></script><script src="levels.js"></script><meta charset="utf-8">

<title>Brooklyn's Jungle Swim</title>
<style>html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#26a69a}canvas{display:block}#mg{position:fixed;inset:0;display:none;background:radial-gradient(circle,#e0f2f1,#a5d6a7 55%,#4caf50);touch-action:none;font-family:sans-serif}
.slot,.pc{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;user-select:none}
.slot{border:6px dashed #fff;background:rgba(255,255,255,.35)}
.slot span{filter:brightness(0);opacity:.25}
.pc{cursor:grab;transition:transform .2s}.pc.done{transition:left .25s,top .25s}
#back{position:absolute;left:calc(16px + env(safe-area-inset-left));top:16px;font-size:44px;background:#fff;border:none;border-radius:50%;width:76px;height:76px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
#yay{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:90px;display:none}
</style>
</head><body><canvas id="c"></canvas><div id="mg"><button id="back">🌿</button><div id="yay">🎉🌟🎉</div></div><script>
LV.msg='YOU DID IT! 🎉';
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const me={x:innerWidth/2,y:innerHeight/2,tx:innerWidth/2,ty:innerHeight/2,e:'🦛',s:1.0};
const pals=[{e:'🐊',s:1.3,d:110,a:0},{e:'🐸',s:1.0,d:90,a:1.26},{e:'🐟',s:0.9,d:80,a:2.51},{e:'🦩',s:1.2,d:125,a:3.77},{e:'🐢',s:1.0,d:100,a:5.03}];
const HOMES=[[.14,.32],[.86,.34],[.16,.72],[.84,.74],[.5,.24]];pals.forEach((p,i)=>{p.hx=HOMES[i][0];p.hy=HOMES[i][1];p.x=p.hx*innerWidth;p.y=p.hy*innerHeight});
let bub=[],stars=[];
let lastB=0;function go(e){const t=e.touches?e.touches[0]:e;me.tx=t.clientX;me.ty=t.clientY;
 const n=performance.now();if(n-lastB>120){lastB=n;for(let i=0;i<2;i++)bub.push({x:t.clientX,y:t.clientY,r:4+Math.random()*8,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2,l:1})}
 if(e.cancelable)e.preventDefault()}
c.addEventListener('pointermove',go);c.addEventListener('touchmove',go,{passive:false});
c.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
for(let i=0;i<5;i++)stars.push({x:Math.random(),y:Math.random()*.68+.2,got:0});
let t=0,score=0,lvBase=0;
// sky/bank colours, water gradient, river bed, things on the bed (d[3] opens matching game), floaters (LILY = drawn lily pad), animals on the bank
const SC=[{n:'lily pad lagoon',sky:'#b3e5fc',bank:'#7cb342',g:['#4db6ac','#00695c'],sand:'#8d6e63',d:['🌿','🪷','🌾','🐚','🌿','🪨'],f:['LILY','LILY','LILY'],b:['🐒','🌴','🦒','🌳','🐒','🌴']},
{n:'jungle river',sky:'#c8e6c9',bank:'#558b2f',g:['#81c784','#1b5e20'],sand:'#6d4c41',d:['🌾','🪵','🌾','🦀','🌾','🌿'],f:['🐟','LILY','🐟'],b:['🦒','🌳','🐘','🌴','🦜','🐒']},
{n:'waterfall pool',sky:'#e1f5fe',bank:'#689f38',g:['#80deea','#00838f'],sand:'#a1887f',d:['🪨','🐚','🪨','💎','🪨','🌿'],f:['🦦','LILY'],b:['🐒','🌴','WF','🌳','🦜','🦒'],wf:1},
{n:'mangrove swamp',sky:'#dcedc8',bank:'#33691e',g:['#9ccc65','#33691e'],sand:'#4e342e',d:['🌿','🍄','🪵','🐍','🌿','🪵'],f:['LILY','🐍','LILY'],b:['🐅','🌳','🦜','🌳','🐒','🌴']},
{n:'starry pond',sky:'#1a237e',bank:'#1b4332',g:['#283593','#002b1a'],sand:'#37474f',d:['🪷','🐸','🪨','🌟','🐸','🪷'],f:['✨','LILY','✨'],b:['🦉','🌳','🦒','🌙','🌳','🦉']}];
let sc=SC[0];LV.onScene=l=>{sc=SC[(l-1)%SC.length];lvBase=score};
function E(e,X,Y,sz,fl){if(e==='LILY')return lily(X,Y,sz);x.save();x.translate(X,Y);if(fl)x.scale(-1,1);x.font=sz+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,0,0);x.restore()}
function lily(X,Y,sz){x.save();x.translate(X,Y);x.rotate(t*.2);x.fillStyle='#43a047';x.beginPath();x.moveTo(0,0);x.arc(0,0,sz*.5,.4,6.0);x.closePath();x.fill();
 x.strokeStyle='#2e7d32';x.lineWidth=2;x.beginPath();x.moveTo(0,0);x.lineTo(-sz*.4,0);x.stroke();x.restore();x.font=(sz*.4)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🌸',X+sz*.12,Y-sz*.1)}
function banks(u){const bh=H*.15;x.fillStyle=sc.sky;x.fillRect(0,0,W,bh);
 if(sc.n=='starry pond'){x.fillStyle='#fff';for(let i=0;i<12;i++){x.globalAlpha=.5+.5*Math.sin(t*2+i);x.fillRect((i*97%100)/100*W,(i*31%60)/100*bh*.6,3,3)}x.globalAlpha=1}
 x.fillStyle=sc.bank;x.beginPath();x.moveTo(0,bh*.55);for(let i=0;i<=12;i++)x.lineTo(i*W/12,bh*(.55+(i%2?.08:-.04)));x.lineTo(W,bh);x.lineTo(0,bh);x.fill();
 sc.b.forEach((e,i)=>{const bx=W*.13+(i+.5)*W*.74/sc.b.length;
  if(e==='WF'){const ww=Math.max(26,W*.07);x.fillStyle='#4fc3f7';x.fillRect(bx-ww/2,0,ww,bh+6);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;
   for(let k=0;k<4;k++){const lx=bx-ww/2+ww*(k+.5)/4;x.beginPath();for(let yy=0;yy<bh;yy+=14){const y0=(yy+t*90)%bh;x.moveTo(lx,y0);x.lineTo(lx,y0+7)}x.stroke()}return}
  const tall=e=='🌳'||e=='🌴'||e=='🦒';E(e,bx,bh*(tall?.45:.58)+(tall?0:Math.abs(Math.sin(t*3+i))*-5),u*(tall?.95:.6),i%2)});
 // water surface ripples
 x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=3;x.beginPath();for(let xx=0;xx<=W;xx+=10)x.lineTo(xx,bh+Math.sin(xx/30+t*2)*3);x.stroke();return bh}
function loop(){t+=.016;
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,sc.g[0]);g.addColorStop(1,sc.g[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
 const u=Math.min(W,H)/8;
 // reeds along the sides
 x.strokeStyle='rgba(51,105,30,.55)';x.lineWidth=5;for(let i=0;i<8;i++){const rx=i<4?i*u*.25+8:W-(i-4)*u*.25-8,sw=Math.sin(t+i)*8;x.beginPath();x.moveTo(rx,H-50);x.quadraticCurveTo(rx+sw,H-50-u*1.2,rx+sw*1.5,H-50-u*2.2);x.stroke()}
 const bh=banks(u);
 x.fillStyle=sc.sand;x.fillRect(0,H-50,W,50);
 sc.d.forEach((e,i)=>E(e,(i+.5)*W/6,H-55+Math.sin(t*2+i)*4,u*.8));
 sc.f.forEach((e,i)=>{x.globalAlpha=.85;E(e,((i*.37+.15+t*.01*(i%2?1:-1))%1+1)%1*W,Math.max(bh+u*.4,H*(.2+.22*i))+Math.sin(t+i)*20,u*.9);x.globalAlpha=1});
 me.x+=(me.tx-me.x)*.06;me.y+=(me.ty-me.y)*.06;const fl=me.tx<me.x;
 pals.forEach((p,i)=>{const a=t*.35+p.a;let gx=p.hx*W+Math.cos(a)*W*.11,gy=p.hy*H+Math.sin(a*1.3)*H*.08;
  const dx=p.x-me.x,dy=p.y-me.y,dd=Math.hypot(dx,dy);if(dd<u*1.6&&dd>1){gx=p.x+dx/dd*u;gy=p.y+dy/dd*u}
  gx=Math.max(u*.6,Math.min(W-u*.6,gx));gy=Math.max(bh+u*.5,Math.min(H-u*1.2,gy));
  p.f=gx<p.x;p.x+=(gx-p.x)*.04;p.y+=(gy-p.y)*.04;E(p.e,p.x,p.y+Math.sin(t*3+i)*5,u*p.s,!p.f)});
 E(me.e,me.x,me.y+Math.sin(t*4)*6,u*1.2,fl);
 stars.forEach(s=>{const sx=s.x*W,sy=s.y*H;if(!s.got){E('🌟',sx,sy+Math.sin(t*3+sx)*6,u*.7);
  if(Math.hypot(sx-me.x,sy-me.y)<u*.8){s.got=1;score++;for(let i=0;i<20;i++)bub.push({x:sx,y:sy,r:5+Math.random()*12,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1});
   setTimeout(()=>{s.x=Math.random()*.9+.05;s.y=Math.random()*.6+.22;s.got=0},1500)}}});
 bub=bub.filter(b=>(b.x+=b.vx,b.y+=b.vy,b.l-=.015,b.l>0));
 bub.forEach(b=>{x.strokeStyle='rgba(255,255,255,'+b.l+')';x.lineWidth=2;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke()});
 if(Math.random()<.05)bub.push({x:Math.random()*W,y:H,r:3+Math.random()*6,vx:0,vy:-1,l:1});
 x.font=(u*.6)+'px serif';x.textAlign='left';x.fillStyle='#fff';x.fillText('🌟 '+score,15,u*.6);
 if(!mgOpen&&!LV.busy()&&score-lvBase>=5){lvBase=score;LV.up(SC[LV.level%SC.length].n)}
 requestAnimationFrame(loop)}loop();

// Matching mini-game (swim down to the 4th thing on the river bed)
var mgOpen=false,cool=0;const mg=document.getElementById('mg');
const kinds=['🦛','🐊','🐸','🐢','🐟','🦩'];
function shellPos(){return{x:3.5*W/6,y:H-55}}
setInterval(()=>{if(mgOpen)return;if(cool>0){cool--;return}
 const sp=shellPos(),u=Math.min(W,H)/8;if(Math.hypot(me.x-sp.x,me.y-sp.y)<u*.9)openMG()},100);
function openMG(){mgOpen=true;mg.innerHTML='<button id="back">🌿</button><div id="yay">🎉🌟🎉</div>';mg.style.display='block';
 document.getElementById('back').onclick=closeMG;
 const pick=kinds.slice().sort(()=>Math.random()-.5).slice(0,4),n=pick.length,sz=Math.min(W/(n+1),H/4,160);
 let left=n;
 const order=pick.slice().sort(()=>Math.random()-.5);
 pick.forEach((k,i)=>{const sl=document.createElement('div');sl.className='slot';
  Object.assign(sl.style,{width:sz+'px',height:sz+'px',left:((i+1)*W/(n+1)-sz/2)+'px',top:(H*.22)+'px',fontSize:sz*.65+'px'});
  sl.innerHTML='<span>'+k+'</span>';sl.dataset.k=k;mg.appendChild(sl)});
 order.forEach((k,i)=>{const pc=document.createElement('div');pc.className='pc';pc.textContent=k;
  const hx=(i+1)*W/(n+1)-sz/2,hy=H*.68;
  Object.assign(pc.style,{width:sz+'px',height:sz+'px',left:hx+'px',top:hy+'px',fontSize:sz*.65+'px'});
  let dx,dy,drag=false;
  pc.addEventListener('pointerdown',e=>{if(pc.dataset.ok)return;drag=true;pc.setPointerCapture(e.pointerId);
   dx=e.clientX-pc.offsetLeft;dy=e.clientY-pc.offsetTop;pc.style.transform='scale(1.2)';pc.style.zIndex=9;e.preventDefault()});
  pc.addEventListener('pointermove',e=>{if(!drag)return;pc.style.left=(e.clientX-dx)+'px';pc.style.top=(e.clientY-dy)+'px'});
  pc.addEventListener('pointerup',e=>{if(!drag)return;drag=false;pc.style.transform='';
   const sl=[...mg.querySelectorAll('.slot')].find(q=>q.dataset.k===k);
   const d=Math.hypot(pc.offsetLeft-sl.offsetLeft,pc.offsetTop-sl.offsetTop);
   pc.classList.add('done');
   if(d<sz*.7){pc.dataset.ok=1;pc.style.left=sl.style.left;pc.style.top=sl.style.top;sl.style.borderColor='#ffeb3b';
    pc.style.transform='scale(1.15)';setTimeout(()=>pc.style.transform='',250);
    if(--left===0){document.getElementById('yay').style.display='block';setTimeout(closeMG,2500)}}
   else{pc.style.left=hx+'px';pc.style.top=hy+'px'}
   setTimeout(()=>pc.classList.remove('done'),300)});
  mg.appendChild(pc)})}
function closeMG(){if(!mgOpen)return;mgOpen=false;mg.style.display='none';cool=30;
 me.y=me.ty=H*.45;score++;for(let i=0;i<25;i++)bub.push({x:me.x,y:me.y,r:5+Math.random()*12,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1})}

// Arrow keys
const keys={};addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=1;e.preventDefault()}});
addEventListener('keyup',e=>{delete keys[e.key]});
setInterval(()=>{if(mgOpen)return;const v=Math.min(W,H)/60;let dx=0,dy=0;
 if(keys.ArrowLeft)dx-=v;if(keys.ArrowRight)dx+=v;if(keys.ArrowUp)dy-=v;if(keys.ArrowDown)dy+=v;
 if(dx||dy){me.tx=Math.max(20,Math.min(W-20,me.x+dx*6));me.ty=Math.max(20,Math.min(H-40,me.y+dy*6))}},16);
</script></body></html>
