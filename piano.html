<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="nozoom.js"></script><script>window.HOME_POS='left';window.HOME_HREF='index.html#music-classroom'</script><script src="home.js"></script><meta charset="utf-8"><title>Piano</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
h1{margin:4px 0 8px;font-size:clamp(20px,min(5vh,7vw),44px);color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
#kb{position:relative;flex:1;display:flex;gap:clamp(3px,.8vw,8px);touch-action:none;min-height:0;max-height:80vh}
.w{flex:1;border-radius:0 0 clamp(12px,3vmin,28px) clamp(12px,3vmin,28px);box-shadow:0 8px 0 #0002,inset 0 -14px 0 #0001;transition:transform .08s,filter .15s,box-shadow .08s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4vmin;font-size:clamp(22px,6vmin,56px)}
.w{flex-direction:column;justify-content:flex-end;align-items:center;gap:1vmin}.w b{font-size:clamp(30px,9vmin,84px);color:#fff;-webkit-text-stroke:2px #0006;text-shadow:0 3px 0 #0005;line-height:1}.b{display:flex;align-items:flex-end;justify-content:center;padding-bottom:1.5vmin;color:#fff;font-weight:900;font-size:clamp(14px,3.6vmin,32px)}
.b{position:absolute;top:0;height:50%;border-radius:0 0 14px 14px;background:linear-gradient(#4a3a6a,#221a33);box-shadow:0 6px 0 #0004;z-index:2;transition:transform .08s,filter .15s}
.on{transform:translateY(5px);filter:brightness(1.25) saturate(1.2);box-shadow:0 2px 0 #0002,0 0 26px 8px #fff8}
.b.on{filter:brightness(2)}
</style></head><body>
<h1>🎹 Piano 🌈</h1>
<div id="kb"></div>
<script>
var W=[['#ff5a5a','⭐'],['#ff9a3c','🌸'],['#ffd93d','☀️'],['#5ed46a','🍀'],['#3fc6f0','💧'],['#5b7bff','🦋'],['#b35cff','🍇'],['#ff6fb5','💖']];
var NL='CDEFGABC',BL=['C♯','D♯','F♯','G♯','A♯'];var WM=[0,2,4,5,7,9,11,12],BM=[[1,0],[3,1],[6,3],[8,4],[10,5]];
var kb=document.getElementById('kb'),keys=[];
W.forEach(function(c,i){var d=document.createElement('div');d.className='w';d.style.background='linear-gradient('+c[0]+'cc,'+c[0]+')';d.innerHTML='<b>'+NL[i]+'</b><span>'+c[1]+'</span>';d.dataset.m=60+WM[i];kb.appendChild(d)});
var bl=[];BM.forEach(function(b,j){var d=document.createElement('div');d.className='b';d.textContent=BL[j];d.dataset.m=60+b[0];d.dataset.after=b[1];kb.appendChild(d);bl.push(d)});
function lay(){var ws=kb.querySelectorAll('.w');bl.forEach(function(d){var a=ws[d.dataset.after],r=a.getBoundingClientRect(),k=kb.getBoundingClientRect(),w=r.width*.55;d.style.width=w+'px';d.style.left=(r.right-k.left-w/2+2)+'px'})}
addEventListener('resize',lay);lay();setTimeout(lay,300);
var ac,master;
function audio(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.35;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination)}
 if(ac.state!=='running')ac.resume();return ac}
function unlock(){var a=audio();if(a){var b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}}
['touchstart','pointerdown','touchend','click'].forEach(function(e){addEventListener(e,unlock,{passive:true,capture:true})});
function play(m){var a=audio();if(!a)return null;var t=a.currentTime,f=440*Math.pow(2,(m-69)/12),g=a.createGain(),lp=a.createBiquadFilter();
 lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*2.5,t+1.2);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.008);g.gain.exponentialRampToValueAtTime(.18,t+.5);g.gain.exponentialRampToValueAtTime(.06,t+3);
 g.connect(lp);lp.connect(master);var os=[[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].map(function(p){var o=a.createOscillator(),og=a.createGain();o.type=p[1];o.frequency.value=f*p[0];og.gain.value=p[2];o.connect(og);og.connect(g);o.start(t);return o});
 return {g:g,os:os}}
function stop(v){if(!v||!ac)return;var t=ac.currentTime;v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t);v.g.gain.exponentialRampToValueAtTime(.0001,t+.35);v.os.forEach(function(o){o.stop(t+.4)})}
var act={};// pointerId -> {el,v}
function keyAt(x,y){var e=document.elementFromPoint(x,y);return e&&e.closest&&e.closest('#kb .w,#kb .b')}
function press(id,el){var c=act[id];if(c&&c.el===el)return;release(id);if(!el)return;el.classList.add('on');act[id]={el:el,v:play(+el.dataset.m)}}
function release(id){var c=act[id];if(!c)return;delete act[id];stop(c.v);var still=Object.keys(act).some(function(k){return act[k].el===c.el});if(!still)c.el.classList.remove('on')}
function all(){Object.keys(act).forEach(release)}
kb.addEventListener('pointerdown',function(e){e.preventDefault();try{kb.setPointerCapture(e.pointerId)}catch(_){}press(e.pointerId,keyAt(e.clientX,e.clientY))});
kb.addEventListener('pointermove',function(e){if(act[e.pointerId])press(e.pointerId,keyAt(e.clientX,e.clientY))});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){kb.addEventListener(n,function(e){release(e.pointerId)})});
kb.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});kb.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
kb.addEventListener('contextmenu',function(e){e.preventDefault()});
addEventListener('blur',all);addEventListener('pagehide',all);document.addEventListener('visibilitychange',function(){if(document.hidden)all();else if(ac)ac.resume()});
</script></body></html>
