<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html,body{touch-action:manipulation}</style>
<script src="nozoom.js"></script><meta charset="utf-8"><title>Brooklyn's Games</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none;overflow:hidden}
h1{margin:0 0 6px;font-size:clamp(16px,min(3.4vh,6vw),32px);line-height:1.1;color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);grid-auto-flow:dense;gap:clamp(6px,min(1.6vh,1.6vw),14px);min-height:0}
a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:clamp(14px,3vmin,32px);text-decoration:none;color:#fff;font-weight:900;text-shadow:0 3px 0 #0003;box-shadow:0 8px 0 #0002,0 12px 24px #0002;animation:bob 3.2s ease-in-out infinite;transition:transform .12s;-webkit-tap-highlight-color:transparent;overflow:hidden;min-height:0}
a:active{transform:scale(.92) translateY(4px)!important;animation-play-state:paused;box-shadow:0 3px 0 #0002}
a .e{font-size:clamp(22px,min(8vh,9vw),90px);line-height:1;animation:wig 2.6s ease-in-out infinite}
a span{font-size:clamp(10px,min(2.8vh,3.2vw),32px);margin-top:2px;line-height:1.1;text-align:center;padding:0 6px}
.big .e{font-size:clamp(40px,min(16vh,18vw),180px)}.big span{font-size:clamp(14px,min(4vh,4.6vw),44px)}
.wide .e{font-size:clamp(26px,min(9vh,10vw),110px)}.wide span{font-size:clamp(12px,min(3vh,4vw),32px)}
.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
a:nth-child(2){animation-delay:-.5s}a:nth-child(3){animation-delay:-1.1s}a:nth-child(4){animation-delay:-1.7s}a:nth-child(5){animation-delay:-2.2s}a:nth-child(6){animation-delay:-.8s}a:nth-child(7){animation-delay:-2.7s}a:nth-child(8){animation-delay:-1.9s}
a:nth-child(even) .e{animation-delay:-1.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.6deg)}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.c1{background:linear-gradient(135deg,#ff6fb5,#ff9a5a)}.c2{background:linear-gradient(135deg,#8a6cff,#47c6ff)}.c3{background:linear-gradient(135deg,#4cd964,#1fb5a8)}.c4{background:linear-gradient(135deg,#2f9bff,#38e0e0)}.c5{background:linear-gradient(135deg,#ffb300,#ff6a3d)}.c6{background:linear-gradient(135deg,#ff5fa2,#b45cff)}.c8{background:linear-gradient(135deg,#7ad0ff,#7b5cff)}.c7{background:linear-gradient(135deg,#ffd93d,#ff8fab)}
@media (max-height:500px){h1{margin-bottom:3px}a{box-shadow:0 4px 0 #0002}}
</style></head>

</div></body></html>
