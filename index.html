<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html,body{touch-action:manipulation}</style>
<script src="nozoom.js"></script><meta charset="utf-8"><title>Brooklyn's Games</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:10px 14px 14px;-webkit-user-select:none;user-select:none;overflow:hidden}
h1{margin:0 0 8px;font-size:clamp(20px,3.6vh,32px);color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);grid-auto-flow:dense;gap:14px;min-height:0}
a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:32px;text-decoration:none;color:#fff;font-weight:900;text-shadow:0 3px 0 #0003;box-shadow:0 8px 0 #0002,0 12px 24px #0002;animation:bob 3.2s ease-in-out infinite;transition:transform .12s;-webkit-tap-highlight-color:transparent;overflow:hidden;min-height:0}
a:active{transform:scale(.92) translateY(4px)!important;animation-play-state:paused;box-shadow:0 3px 0 #0002}
a .e{font-size:clamp(40px,9vh,90px);line-height:1;animation:wig 2.6s ease-in-out infinite}
a span{font-size:clamp(18px,3.2vh,32px);margin-top:6px;text-align:center;padding:0 6px}
.big .e{font-size:clamp(70px,18vh,180px)}.big span{font-size:clamp(24px,4.5vh,44px)}
.wide .e{font-size:clamp(50px,11vh,110px)}
.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
a:nth-child(2){animation-delay:-.5s}a:nth-child(3){animation-delay:-1.1s}a:nth-child(4){animation-delay:-1.7s}a:nth-child(5){animation-delay:-2.2s}a:nth-child(6){animation-delay:-.8s}a:nth-child(7){animation-delay:-2.7s}
a:nth-child(even) .e{animation-delay:-1.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.6deg)}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.c1{background:linear-gradient(135deg,#ff6fb5,#ff9a5a)}.c2{background:linear-gradient(135deg,#8a6cff,#47c6ff)}.c3{background:linear-gradient(135deg,#4cd964,#1fb5a8)}.c4{background:linear-gradient(135deg,#2f9bff,#38e0e0)}.c5{background:linear-gradient(135deg,#ffb300,#ff6a3d)}.c6{background:linear-gradient(135deg,#ff5fa2,#b45cff)}.c7{background:linear-gradient(135deg,#ffd93d,#ff8fab)}
@media (max-width:600px){body{height:auto;min-height:100dvh;overflow:auto}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:110px;gap:12px}a .e,.wide .e{font-size:54px}.big .e{font-size:90px}a span,.big span{font-size:22px}}
</style></head>
<body><h1>Brooklyn's Games 🌈</h1><div class="grid">
<a class="big c1" href="coloring.html"><div class="e">🖍️</div><span>Coloring Fun</span></a>
<a class="big c2" href="popit.html"><div class="e">🫧</div><span>Pop It!</span></a>
<a class="wide c3" href="dino.html"><div class="e">🦖</div><span>Dino Adventure</span></a>
<a class="wide c4" href="ocean.html"><div class="e">🐋</div><span>Ocean Swim</span></a>
<a class="wide c5" href="paint.html"><div class="e">🎨</div><span>Finger Paint</span></a>
<a class="c6" href="colors.html"><div class="e">🌈</div><span>Color Game</span></a>
<a class="c7" href="abc.html"><div class="e">🔤</div><span>ABCs</span></a>
</div></body></html>
