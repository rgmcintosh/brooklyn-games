<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none;overflow-x:hidden;overflow-y:auto}
h1{margin:0 0 6px;font-size:clamp(16px,min(3.4vh,6vw),32px);line-height:1.1;color:#e0408a;text-align:center;text-shadow:0 2px 0 #fff}
.grid{flex:none;height:calc(100dvh - 20px);min-height:480px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);grid-auto-flow:dense;gap:clamp(6px,min(1.6vh,1.6vw),14px);min-height:0}
a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:clamp(14px,3vmin,32px);text-decoration:none;color:#fff;font-weight:900;text-shadow:0 3px 0 #0003;box-shadow:0 8px 0 #0002,0 12px 24px #0002;animation:bob 3.2s ease-in-out infinite;transition:transform .12s;-webkit-tap-highlight-color:transparent;overflow:hidden;min-height:0}
a:active{transform:scale(.92) translateY(4px)!important;animation-play-state:paused;box-shadow:0 3px 0 #0002}
a .e{font-size:clamp(22px,min(8vh,9vw),90px);line-height:1;animation:wig 2.6s ease-in-out infinite}
a span{font-size:clamp(10px,min(2.8vh,3.2vw),32px);margin-top:2px;line-height:1.1;text-align:center;padding:0 6px}
.big .e{font-size:clamp(40px,min(16vh,18vw),180px)}.big span{font-size:clamp(14px,min(4vh,4.6vw),44px)}
.wide .e{font-size:clamp(26px,min(9vh,10vw),110px)}.wide span{font-size:clamp(12px,min(3vh,4vw),32px)}
a.full{grid-column:1 / span 4}a.full .e{font-size:clamp(26px,min(9vh,10vw),110px)}a.full span{font-size:clamp(12px,min(3vh,4vw),32px)}.c12{background:linear-gradient(135deg,#ff8a3d,#ff4f9a 55%,#8a6cff)}.c11{background:linear-gradient(90deg,#ff5a5a,#ffd93d,#5ed46a,#3fc6f0,#b35cff)}
.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
a:nth-child(2){animation-delay:-.5s}a:nth-child(3){animation-delay:-1.1s}a:nth-child(4){animation-delay:-1.7s}a:nth-child(5){animation-delay:-2.2s}a:nth-child(6){animation-delay:-.8s}a:nth-child(7){animation-delay:-2.7s}a:nth-child(8){animation-delay:-1.9s}a:nth-child(9){animation-delay:-.3s}a:nth-child(10){animation-delay:-2.4s}
a:nth-child(even) .e{animation-delay:-1.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.6deg)}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.c1{background:linear-gradient(135deg,#ff6fb5,#ff9a5a)}.c2{background:linear-gradient(135deg,#8a6cff,#47c6ff)}.c3{background:linear-gradient(135deg,#4cd964,#1fb5a8)}.c4{background:linear-gradient(135deg,#2f9bff,#38e0e0)}.c5{background:linear-gradient(135deg,#ffb300,#ff6a3d)}.c6{background:linear-gradient(135deg,#ff5fa2,#b45cff)}.c8{background:linear-gradient(135deg,#7ad0ff,#7b5cff)}.c7{background:linear-gradient(135deg,#ffd93d,#ff8fab)}.c9{background:linear-gradient(135deg,#8bc34a,#2e7d32)}.c10{background:linear-gradient(135deg,#26c6a0,#5d8a3a)}
#music-classroom{position:relative;flex:none;height:clamp(300px,52dvh,560px);margin:0 0 14px;border-radius:clamp(16px,3vmin,32px);overflow:hidden;background:linear-gradient(#ffe6f2 0 66%,#f6c38f 66%);box-shadow:0 8px 0 #0002,inset 0 0 0 6px #fff8}
#music-classroom h2{position:absolute;top:3%;left:0;right:0;margin:0;text-align:center;font-size:clamp(20px,4.4vmin,40px);color:#8a3cff;text-shadow:0 2px 0 #fff}
.room-svg{position:absolute;inset:0;width:100%;height:100%}
.inst{position:absolute;bottom:6%;width:18%;height:58%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#5a2a7a;text-shadow:0 2px 0 #fff;font-weight:900;font-size:clamp(13px,2.8vmin,26px);text-decoration:none;background:none;box-shadow:none;animation:bob 3s ease-in-out infinite;border-radius:24px;-webkit-tap-highlight-color:transparent}
.inst:active{background:#fff6}.inst .ic{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;font-size:clamp(46px,13vmin,130px);line-height:1}.inst svg{width:90%;height:auto;max-height:100%}
.inst:nth-of-type(1){left:1%}.inst:nth-of-type(2){left:20.5%;animation-delay:-.6s}.inst:nth-of-type(3){left:40.5%;animation-delay:-1.2s}.inst:nth-of-type(4){left:60.5%;animation-delay:-1.8s}.inst:nth-of-type(5){left:80.5%;animation-delay:-2.4s}
@media (max-height:500px){h1{margin-bottom:3px}a{box-shadow:0 4px 0 #0002}}
</style></head>
