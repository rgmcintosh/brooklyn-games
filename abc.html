<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>html,body{touch-action:manipulation}</style>
<script src="nozoom.js"></script>
<script>window.HOME_POS='left'</script><script src="home.js"></script><meta charset="utf-8"><title>ABCs</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Arial Rounded MT Bold',sans-serif;background:linear-gradient(#e0f7ff,#ffe0f0)}
#modes{position:fixed;top:10px;right:10px;display:flex;gap:10px;z-index:5}
#modes button{width:80px;height:70px;border-radius:20px;border:4px solid #fff;background:#fff;font-size:38px;box-shadow:0 4px 10px #0003}
#modes button.on{border-color:#ff4fa3;background:#ffe3f1}
.view{position:fixed;left:0;right:0;top:90px;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.view.on{display:flex}
#card{background:#fff;border-radius:40px;box-shadow:0 12px 30px #0003;padding:10px 40px;display:flex;align-items:baseline;gap:10px}
#big{font-size:min(50vw,38vh);font-weight:900;line-height:1}
#small{font-size:min(20vw,15vh);font-weight:900}
#emo{font-size:min(28vw,20vh);margin-top:10px}
.bounce{animation:bo .5s}
@keyframes bo{30%{transform:scale(1.2) rotate(-5deg)}60%{transform:scale(.92)}}
.nav{position:fixed;bottom:16px;width:100px;height:100px;border-radius:50%;border:none;background:#fff;font-size:56px;box-shadow:0 6px 14px #0003}
#prev{left:16px}#next{right:16px}
#choices{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
.ch{width:min(28vw,30vh);height:min(32vw,34vh);background:#fff;border-radius:32px;box-shadow:0 10px 24px #0003;display:flex;align-items:center;justify-content:center;font-size:min(22vw,24vh);font-weight:900}
#ask{font-size:70px;margin-bottom:20px}
.wig{animation:wg .5s}
@keyframes wg{20%,60%{transform:rotate(-10deg)}40%,80%{transform:rotate(10deg)}}
#learn{justify-content:flex-start;padding-top:4px}
#pz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#pemo{font-size:min(26vw,18vh);line-height:1.1}
#pword{display:flex;align-items:center;gap:4px;background:#fff;border-radius:30px;box-shadow:0 10px 24px #0003;padding:8px 22px;font-size:min(12vw,8vh);font-weight:900;color:#555;margin-top:8px}
#slot{width:min(18vw,11vh);height:min(20vw,12vh);border:5px dashed #ff4fa3;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:min(14vw,9vh);background:#fff6fb}
#slot{position:relative}#slot:empty::before{content:attr(data-ghost);color:transparent;-webkit-text-stroke:2px rgba(255,79,163,.35);font-weight:900}
#slot.hot{background:#ffd6ec}#slot.done{border-style:solid;border-color:#2fbf3a;background:#eaffea}
#tray{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 6px 14px;max-width:1000px;overflow-y:auto;max-height:42vh}
.lt{width:min(13vw,62px);height:min(13vw,62px);border-radius:14px;background:#fff;box-shadow:0 4px 8px #0003;display:flex;align-items:center;justify-content:center;font-size:min(9vw,40px);font-weight:900;touch-action:none;cursor:grab;border:3px solid #fff}
.lt.sel{border-color:#ff4fa3;transform:scale(1.1)}
.lt.drag{position:fixed;z-index:50;pointer-events:none;transform:scale(1.25)}
.cf{position:fixed;width:14px;height:14px;z-index:6;pointer-events:none;border-radius:3px}
</style></head><body>
<div id="modes"><button id="mLearn" class="on">🔊</button><button id="mFind">🔍</button></div>
<div id="learn" class="view on"><div id="pz"><div id="pemo"></div><div id="pword"><div id="slot"></div><span id="prest"></span></div></div><div id="tray"></div></div>
<div id="find" class="view"><div id="ask">🔍<span id="askE"></span></div><div id="choices"></div></div>
<script>
const W=[['A','apple','🍎'],['B','ball','⚽'],['C','cat','🐱'],['D','dog','🐶'],['E','elephant','🐘'],['F','fish','🐟'],['G','grapes','🍇'],['H','house','🏠'],['I','ice cream','🍦'],['J','jellyfish','🪼'],['K','kite','🪁'],['L','lion','🦁'],['M','moon','🌙'],['N','nest','🪺'],['O','octopus','🐙'],['P','pig','🐷'],['Q','queen','👸'],['R','rainbow','🌈'],['S','sun','☀️'],['T','turtle','🐢'],['U','umbrella','☂️'],['V','violin','🎻'],['W','whale','🐳'],['X','xylophone','🎶'],['Y','yo-yo','🪀'],['Z','zebra','🦓']];
const COL=['#ff3b3b','#ff9a1f','#e6b800','#2fbf3a','#2e8bff','#a64dff','#ff4fc1','#00b8a9'];
let i=0,target=0,busy=false;
const $=id=>document.getElementById(id);
function say(t){const s=window.speechSynthesis;if(!s)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.2;u.volume=1;
 try{if(s.speaking||s.pending)s.cancel();s.resume();s.speak(u);}catch(e){}}
function bounce(el){el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce')}
let sel=null,solved=false;
function show(speak){const [L,w,e]=W[i];solved=false;sel=null;$('pemo').textContent=e;$('slot').textContent='';$('slot').className='';$('slot').dataset.ghost=L.toLowerCase();
 $('prest').textContent=w.slice(1);bounce($('pemo'));buildTray();if(speak)say(w+'!');}
function buildTray(){const t=$('tray');t.innerHTML='';W.forEach((x,n)=>{const d=document.createElement('div');d.className='lt';d.textContent=x[0];d.dataset.n=n;d.style.color=COL[n%COL.length];
 d.addEventListener('pointerdown',ev=>startDrag(ev,d));t.appendChild(d)})}
function overSlot(x,y){const r=$('slot').getBoundingClientRect();return x>r.left-20&&x<r.right+20&&y>r.top-20&&y<r.bottom+20}
function startDrag(ev,d){ev.preventDefault();if(solved)return;const sx=ev.clientX,sy=ev.clientY,r=d.getBoundingClientRect();let moved=false,ph=null;
 const mv=e=>{if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){moved=true;ph=d.cloneNode(true);ph.style.visibility='hidden';d.after(ph);d.classList.add('drag');d.style.width=r.width+'px';d.style.height=r.height+'px'}
  if(moved){d.style.left=(e.clientX-r.width/2)+'px';d.style.top=(e.clientY-r.height/2)+'px';$('slot').classList.toggle('hot',overSlot(e.clientX,e.clientY))}};
 const up=e=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);$('slot').classList.remove('hot');
  if(moved){d.classList.remove('drag');d.style.left=d.style.top=d.style.width=d.style.height='';ph.remove();if(overSlot(e.clientX,e.clientY))place(+d.dataset.n,d)}
  else{document.querySelectorAll('.lt.sel').forEach(x=>x.classList.remove('sel'));sel=d;d.classList.add('sel');say(W[d.dataset.n][0])}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
tap($('slot'),()=>{if(sel&&!solved)place(+sel.dataset.n,sel)});
tap($('pemo'),()=>say(W[i][1]+'!'));
function place(n,d){if(solved)return;const [L,w]=W[i];
 if(n===i){solved=true;window.lastSuccess=L;const s=$('slot');s.textContent=L.toLowerCase();s.style.color=COL[i%COL.length];s.className='done';d.style.visibility='hidden';
  say(L+'... '+w+'!');bounce($('pword'));confetti();setTimeout(cheer,1600);setTimeout(()=>{i=(i+1)%26;show(true)},2800)}
 else{d.classList.remove('sel','wig');void d.offsetWidth;d.classList.add('wig');sel=null;say("That's "+W[n][0]+'. Try again!')}}
function tap(el,f){el.addEventListener('pointerdown',e=>{e.preventDefault();f(e)})}
function setMode(f){$('mLearn').classList.toggle('on',!f);$('mFind').classList.toggle('on',f);$('learn').classList.toggle('on',!f);$('find').classList.toggle('on',f);f?round():show(true)}
tap($('mLearn'),()=>setMode(false));tap($('mFind'),()=>setMode(true));
function round(){busy=false;let t;do t=Math.floor(Math.random()*26);while(t===target);target=t;
 const set=[t];while(set.length<3){const r=Math.floor(Math.random()*26);if(!set.includes(r))set.push(r)}set.sort(()=>Math.random()-.5);
 const c=$('choices');c.innerHTML='';set.forEach((n,k)=>{const d=document.createElement('div');d.className='ch';d.textContent=W[n][0];d.style.color=COL[(n+k)%COL.length];
  tap(d,()=>pick(n,d));c.appendChild(d)});$('askE').textContent='';say('Find '+W[t][0]+'!');}
function pick(n,d){if(busy)return;const [L,w,e]=W[target];
 if(n===target){busy=true;bounce(d);$('askE').textContent=e;say('Yay! '+L+', '+w+'!');confetti();setTimeout(cheer,1800);setTimeout(round,2600)}
 else{d.classList.remove('wig');void d.offsetWidth;d.classList.add('wig');say("That's "+W[n][0]+'. Find '+L+'!')}}
let actx;function cheer(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();[523,659,784,1047].forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+k*.1;o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.3)})}catch(e){}}
function confetti(){for(let k=0;k<40;k++){const c=document.createElement('div');c.className='cf';c.style.background=COL[k%8];c.style.left=innerWidth/2+'px';c.style.top=innerHeight/2+'px';document.body.appendChild(c);
 const a=Math.random()*6.28,v=150+Math.random()*250;c.animate([{transform:'translate(0,0)'},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+200}px) rotate(720deg)`,opacity:0}],{duration:1400});setTimeout(()=>c.remove(),1400)}}
show(false);
</script></body></html>
