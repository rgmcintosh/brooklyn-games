<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS",ui-rounded,system-ui,sans-serif;background:linear-gradient(135deg,#fff9c4,#ffe0f0 50%,#d7f0ff);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.6deg)}}
@media (orientation:portrait){.inst{height:40%!important}}
#music-classroom{position:relative;flex:1;min-height:0;margin:0;border-radius:clamp(16px,3vmin,32px);overflow:hidden;background:linear-gradient(#ffe6f2 0 66%,#f6c38f 66%);box-shadow:0 8px 0 #0002,inset 0 0 0 6px #fff8}
#music-classroom h2{position:absolute;top:3%;padding:0 70px;left:0;right:0;margin:0;text-align:center;font-size:clamp(20px,4.4vmin,40px);color:#8a3cff;text-shadow:0 2px 0 #fff}
.room-svg{position:absolute;inset:0;width:100%;height:100%}
.inst{position:absolute;bottom:8%;width:18%;height:56%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#5a2a7a;text-shadow:0 2px 0 #fff;font-weight:900;font-size:clamp(16px,3.4vmin,34px);text-decoration:none;background:none;box-shadow:none;animation:bob 3s ease-in-out infinite;border-radius:24px;-webkit-tap-highlight-color:transparent}
.inst:active{background:#fff6}.inst .ic{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;font-size:clamp(56px,16vmin,170px);line-height:1}.inst svg{width:90%;height:auto;max-height:100%}
.inst:nth-of-type(1){left:1%}.inst:nth-of-type(2){left:20.5%;animation-delay:-.6s}.inst:nth-of-type(3){left:40.5%;animation-delay:-1.2s}.inst:nth-of-type(4){left:60.5%;animation-delay:-1.8s}.inst:nth-of-type(5){left:80.5%;animation-delay:-2.4s}
</style></head>
